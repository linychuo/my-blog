name: zig-build

on:
  push:
    branches: [ zig-build ]
  pull_request:
    branches: [ zig-build ]

jobs:
  build-on-win_and_linux:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository ${{ matrix.os }}
        uses: actions/checkout@v3

      - name: Install Zig ${{ matrix.os }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      
      - name: Build&Run ${{ matrix.os }}
        run: zig build run

  deploy:
      runs-on: [ubuntu-latest]

      steps:
        - name: Checkout repository
          uses: actions/checkout@v3

        - name: Install Zig
          uses: mlugg/setup-zig@v2
          with:
            version: 0.15.2
      
        - name: Build&Run
          run: zig build run
          
        - name: Deploy
          uses: JamesIves/github-pages-deploy-action@4.1.8
          with:
            branch: gh-pages
            folder: build

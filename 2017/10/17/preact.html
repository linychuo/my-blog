    <script>
        const backToTopBtn=document.getElementById('backToTop');
        window.addEventListener('scroll',()=>{backToTopBtn.classList.toggle('visible',window.scrollY>400);});
        function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}
        function toggleTheme(){
            const html=document.documentElement;
            const newTheme=html.getAttribute('data-theme')==='light'?'dark':'light';
            html.setAttribute('data-theme',newTheme);
            localStorage.setItem('theme',newTheme);
            document.getElementById('hljs-theme').href=newTheme==='light'?'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css':'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
        }
        // Render math blocks
        document.addEventListener('DOMContentLoaded',function(){
            if(typeof katex!=='undefined'){
                document.querySelectorAll('pre.math-block').forEach(function(el){
                    try{
                        const tex=el.textContent.trim();
                        const div=document.createElement('div');
                        div.className='katex-display';
                        katex.render(tex,div,{displayMode:true,throwOnError:false});
                        el.parentNode.replaceChild(div,el);
                    }catch(e){console.error('KaTeX render error:',e);}
                });
            }
        });
    </script>
